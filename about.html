<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>About — David Bomhoff</title>
  <meta name="description" content="About David Bomhoff.">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="ux-page">
  <!-- PLACEHOLDER PAGE: no Figma design for "about" exists yet — this is just enough
       to give the navbar's "about" button somewhere real to link to. Replace this
       whole main section once the page is designed. -->
  <header class="ux-hero">
    <!-- Site-wide navbar, from Figma's "Frame 10" — centered, near the top, on its own layer
         so it doesn't push the logo down (that has to stay pinned to the true page top). -->
    <nav class="site-nav" aria-label="Main">
      <a class="nav-btn nav-btn--home" href="./index.html">home</a>
      <a class="nav-btn nav-btn--gdes" href="./graphic.html">gdes</a>
      <a class="nav-btn nav-btn--ux" href="./ux.html">ux</a>
      <a class="nav-btn nav-btn--arcade" href="./arcade.html">arcade</a>
      <a class="nav-btn nav-btn--about" href="./about.html" aria-current="page">about</a>
    </nav>

    <div class="brand-lockup">
      <!-- The two strings the rings hang from — stretch when you drag, see main.js -->
      <span class="logo-string logo-string--a" aria-hidden="true"></span>
      <span class="logo-string logo-string--b" aria-hidden="true"></span>
      <img class="logo-drag" src="./assets/icons/logo-swirl.svg" alt="" aria-hidden="true">
      <h1 class="brand-name">
        <span class="visually-hidden">David Bomhoff</span>
        <span class="name-avid" aria-hidden="true">avid</span>
        <span class="name-omhoff" aria-hidden="true">omhoff</span>
      </h1>
    </div>
  </header>

  <main class="wrap" style="padding-bottom: var(--space-5);">
    <p style="font-size: 1.25rem;">Coming soon.</p>
  </main>
